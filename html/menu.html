<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Menu</title>
    <link rel="stylesheet" href="../css/menu.css" />
  </head>
  <body>

    <nav class="navbar">
      <div class="hamburger" onclick="toggleMenu()">☰</div>
      <ul class="nav-links">
        <li><a href="login">Home</a></li>
        <li><a href="menu">Food Menu</a></li>
        <li><a href="contact">Contact</a></li>
      </ul>
      <a href="kart">
        <img
          src="/images/icon-1001596_640.webp"
          class="cart-icon"
          alt="Kundvagn"
        />
      </a>
    </nav>

    <!-- KATEGORI-RAD -->
    <div class="category-bar">
      <div class="category-item">
        <img src="" alt="Burgare" />
        <p>Burgare</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Pasta</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Kyckling</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Smörgåsar</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Sushi</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Poke Bowl</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Sallader</p>
      </div>
      <div class="category-item">
        <img src="" alt="" />
        <p>Kebab</p>
      </div>
    </div>

    <!-- MAT-GRID -->
    <div class="food-grid">
      <div id="food-container"></div>
    </div>

    <script src="../javascript/kundvagn/LoadProducts.js"></script>
    <script>
      async function renderFoodCards() {
        const response = await fetch("/api/products");
        const foods = await response.json();

        const container = document.getElementById("food-container");
        container.innerHTML = "";

        foods.forEach((food) => {
          const card = document.createElement("div");
          card.className = "food-card";

          const imagePath = food.image_path
            ? `../images/${food.image_path}`
            : "../images/default-food.png";
          console.log(
            `Rendering food: ${food.mat_namn}, Image path: ${imagePath}`,
          );

          card.innerHTML = `
    <img src="${imagePath}" alt="${food.mat_namn}" class="food-img" />
    <h3 class="food-name">${food.mat_namn}</h3>
    <p class="food-description">${food.description}</p>
    <p class="food-meat">
        ${food.contains_meat ? "🥩 Innehåller kött" : "🥗 Vegetarisk"}
    </p>
    <div class="food-footer">
        <span class="food-price">${food.mat_pris} kr</span>
        <button class="add-btn" onclick="addToCart(${food.id}, '${food.mat_namn}', ${food.mat_pris}, '${food.image_path}')">+</button>
    </div>
`;

          container.appendChild(card);
        });
      }

      renderFoodCards();
    </script>
    <script>
      async function addToCart(id, namn, pris, bild) {
        const response = await fetch("/api/cart/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, name: namn, price: pris, image: bild }),
        });

        if (response.ok) {
          alert(`${namn} lades till i kundvagnen!`);
        }
      }

      function toggleMenu() {
        document.querySelector(".nav-links").classList.toggle("active");
      }

      // Stäng menyn när en länk klickas (förbättrar UX på mobil)
      document.querySelectorAll(".nav-links a").forEach((link) => {
        link.addEventListener("click", () => {
          document.querySelector(".nav-links").classList.remove("active");
        });
      });

      // Stäng menyn automatiskt om fönstret ändras till desktop-storlek
      window.addEventListener("resize", function () {
        if (window.innerWidth > 768) {
          document.querySelector(".nav-links")?.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
