<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/register.css" />

</head>
<body>

    <div class="container-fluid p-0"> 

        <div class="row g-0">

            <div class="col-7" id="v">

                <nav class="navbar">

                    <ul class="nav-links">

                        <li><a href="index.html">Home</a></li>
                        <li><a href="menu.html">Food Menu</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
                <h1>Fork & Fun</h1>
                <form class="container col-8" id="form" action="/register" method="POST">
                <div class="form-group">
                    <label for="InputFirstName">First Name</label>
                    <input type="text" name="firstname" class="form-control" id="InputFirstName" aria-describedby="emailHelp">
                    <span class="error-msg" id="firstnameError"></span>
                </div>
                <div class="form-group">
                    <label for="InputLastName">Last Name</label>
                    <input type="text" name="lastname" class="form-control" id="InputLastName" aria-describedby="emailHelp">
                    <span class="error-msg" id="lastnameError"></span>
                </div>
                <div class="form-group">
                    <label for="InputEmail">Email</label>
                    <input type="email" name="email" class="form-control" id="InputEmail" aria-describedby="emailHelp">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="InputPassword">Password</label>
                    <input type="password" name="password" class="form-control" id="InputPassword">
                    <span class="error-msg" id="passwordError"></span>
                </div>
                <div class="form-group">
                    <label for="InputPhone">Phone</label>
                    <input type="text" name="phone" class="form-control" id="InputPhone">
                    <span class="error-msg" id="phoneError"></span>
                </div>
                <div class="form-group">
                    <label for="InputAddress">Address</label>
                    <input type="text" name="address" class="form-control" id="InputAddress">
                    <span class="error-msg" id="addressError"></span>
                </div>
                <br>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button type="submit" class="btn btn-success">Submit</button>
                </div>
                
                </form>
                

            </div>
            <div class="col-5" id="h">

                <img src="../images/pizzay.png" alt="">
        </div>
    </div>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../javascript/signup/validation.js"></script>
</body>
</html>
