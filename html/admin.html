<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <button class="menu-btn" onclick="openMenu()">☰</button>
      <a class="navbar-brand" href="#">Admin</a>
    </nav>

    <div id="overlay" onclick="closeMenu()"></div>

    <div id="sideMenu">
      <img src="../images/DITTBILD.png" onclick="closeMenu()" class="close-img" alt="close" />
      <ul>
        <li><a href="login">Home</a></li>
        <li><a href="menu">Food Menu</a></li>
        <li><a href="contact">Contact</a></li>
      </ul>
    </div>

    <div class="admin-container">
      <div class="top-bar">
        <h1>Admin Panel</h1>
        <button class="add-btn"><a href="productadd.html">+ Lägg till produkt</a></button>
      </div>

      <div class="products">
        <div class="product-card">
          <h3>mat</h3>
          <p>beskrvning</p>
          <div class="actions">
            <button class="edit-btn">Redigera</button>
            <button class="delete-btn">Ta bort</button>
          </div>
        </div>

        <div class="product-card">
          <h3>mat</h3>
          <p>beskrvning</p>
          <div class="actions">
            <button class="edit-btn">Redigera</button>
            <button class="delete-btn">Ta bort</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      function openMenu() {
        document.getElementById("sideMenu").classList.add("open");
        document.getElementById("overlay").classList.add("active");
      }
      function closeMenu() {
        document.getElementById("sideMenu").classList.remove("open");
        document.getElementById("overlay").classList.remove("active");
      }
    </script>
  </body>
</html>
