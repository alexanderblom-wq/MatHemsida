<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="hamburger" onclick="toggleMenu()">☰</div>
      <ul class="nav-links">
        <li><a href="login">Home</a></li>
        <li><a href="menu">Food Menu</a></li>
        <li><a href="contact">Contact</a></li>
      </ul>
    </nav>

    <div class="admin-container">
      <div class="top-bar">
        <h1>Admin Panel</h1>
        <button class="add-btn"><a href="productadd">+ Lägg till produkt</a></button>
      </div>

      <div id="product-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      function toggleMenu() {
        document.querySelector(".nav-links").classList.toggle("active");
      }
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          document.querySelector('.nav-links').classList.remove('active');
        });
      });
      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          document.querySelector('.nav-links')?.classList.remove('active');
        }
      });

      async function loadProducts() {
        const response = await fetch('/api/products');
        const products = await response.json();
        const container = document.getElementById('product-container');
        container.innerHTML = '';

        products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'admin-card';
          card.innerHTML = `
            <img src="../images/${product.image_path}" alt="${product.mat_namn}" />
            <div class="admin-card-info">
              <h3>${product.mat_namn}</h3>
              <p>${product.description}</p>
              <p><strong>${product.mat_pris} kr</strong></p>
              <p>${product.contains_meat ? '🥩 Innehåller kött' : '🥗 Vegetarisk'}</p>
            </div>
            <button class="delete-btn" onclick="deleteProduct(${product.id})">🗑️ Ta bort</button>
          `;
          container.appendChild(card);
        });
      }

      async function deleteProduct(id) {
        if (!confirm('Är du säker på att du vill ta bort produkten?')) return;

        const response = await fetch(`/delete-product/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          loadProducts(); // ladda om listan
        } else {
          alert('Kunde inte ta bort produkten.');
        }
      }

      loadProducts();
    </script>
  </body>
</html>
