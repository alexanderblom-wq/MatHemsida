<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fork & Fun – Kundvagn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/kart.css" />
  </head>
  <body>
    <nav class="navbar">
      <button class="menu-btn" onclick="openMenu()">☰</button>
      <ul class="nav-links">
        <li><a href="logout">Logout</a></li>
        <li><a href="menu">Food menu</a></li>
        <li><a href="contact">Contact</a></li>
      </ul>
    </nav>
    <div id="overlay" onclick="closeMenu()"></div>
    <div id="sideMenu">
      <img src="/images/2085957-200.png" onclick="closeMenu()" class="close-img" alt="close" />
      <ul>
        <li><a href="index">Home</a></li>
        <li><a href="menu">Food menu</a></li>
        <li><a href="contact">Contact</a></li>
      </ul>
    </div>
    <main class="cart-page">
      <div class="cart-outer">
        <p class="cart-heading">Your cart</p>
        <div class="cart-box" id="cart-items"></div>
        <div class="cart-footer">
          <button class="pay-btn" onclick="goToPayment()">
  Betala
        </button>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

      // ==========================
      // MENY (HAMBURGER)
      // ==========================

      // Öppnar sidomenyn
      function openMenu() {
        document.getElementById('sideMenu').classList.add('open');
        document.getElementById('overlay').classList.add('active');
      }

      // Stänger sidomenyn
      function closeMenu() {
        document.getElementById('sideMenu').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
      }


      // ==========================
      // RENDERA KUNDVAGNEN
      // ==========================
      async function renderCart() {

        // Hämtar kundvagnens innehåll från servern
        const res = await fetch('/api/cart');
        const items = await res.json();
        const container = document.getElementById('cart-items');

        // Om kundvagnen är tom, visa meddelande
        if (items.length === 0) {
          container.innerHTML = '<p style="text-align:center; padding: 20px; color: white;">Din kundvagn är tom.</p>';
          return;
        }

        // Loopar igenom alla produkter och bygger HTML
        let total = 0;
        container.innerHTML = items.map(item => {
          total += item.price * item.quantity;

          // Visar kött-ikon eller vegetarisk-ikon
          const meatBadge = item.contains_meat
            ? '<span class="badge meat">🥩 Kött</span>'
            : '<span class="badge veg">🌱 Vegetarisk</span>';

          return `
            <div class="cart-item">
              <img src="/images/${item.image}" alt="${item.name}" class="cart-item-img" />
              <div class="cart-item-info">
                <p class="cart-item-name">${item.name}</p>
                ${meatBadge}
                <p class="cart-item-price">${item.price} kr/st</p>
              </div>
              <div class="cart-item-right">
                <div class="quantity-controls">
                  <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                </div>
                <p class="cart-item-subtotal">${item.price * item.quantity} kr</p>
                <button class="remove-btn" onclick="removeFromCart(${item.id})">✕</button>
              </div>
            </div>
          `;
        }).join('');

        // Visar totalpriset längst ner
        container.innerHTML += `<div class="cart-total">Totalt: <strong>${total} kr</strong></div>`;
      }


      // ==========================
      // UPPDATERA ANTAL
      // ==========================
      async function updateQuantity(id, newQuantity) {

        // Skickar nytt antal till servern
        await fetch('/api/cart/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, quantity: newQuantity })
        });

        // Renderar om kundvagnen
        renderCart();
      }


      // ==========================
      // TA BORT PRODUKT
      // ==========================
      async function removeFromCart(id) {

        // Skickar bort-förfrågan till servern
        await fetch('/api/cart/remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });

        // Renderar om kundvagnen
        renderCart();
      }


      // ==========================
      // GÅ TILL BETALNING
      // ==========================
      async function goToPayment() {

        // Hämtar kundvagnen för att kolla om den är tom
        const res = await fetch('/api/cart');
        const items = await res.json();

        // Om tom, visa varning
        if (items.length === 0) {
          alert("Kundvagnen är tom!");
          return;
        }

        // Tömmer kundvagnen i databasen
        await fetch('/api/cart/clear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        // Skickar till betalningssidan
        window.location.href = "/betala";
      }


      // Kör renderCart direkt när sidan laddas
      renderCart();
    </script>
  </body>
</html>
