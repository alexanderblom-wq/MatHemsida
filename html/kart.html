<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fork & Fun – Kundvagn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/kart.css" />
  </head>
  <body>
    <nav class="navbar">
      <button class="menu-btn" onclick="openMenu()">☰</button>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Food menu</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div id="overlay" onclick="closeMenu()"></div>
    <div id="sideMenu">
      <img src="/images/2085957-200.png" onclick="closeMenu()" class="close-img" alt="close" />
      <ul>
        <li><a href="index">Home</a></li>
        <li><a href="menu">Food menu</a></li>
        <li><a href="contact">Contact</a></li>
      </ul>
    </div>
    <main class="cart-page">
      <div class="cart-outer">
        <p class="cart-heading">Your cart</p>
        <div class="cart-box" id="cart-items"></div>
        <div class="cart-footer">
          <button class="pay-btn">Betala</button>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      function openMenu() {
        document.getElementById('sideMenu').classList.add('open');
        document.getElementById('overlay').classList.add('active');
      }
      function closeMenu() {
        document.getElementById('sideMenu').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
      }

      async function renderCart() {
        const res = await fetch('/api/cart');
        const items = await res.json();
        const container = document.getElementById('cart-items');

        if (items.length === 0) {
          container.innerHTML = '<p style="text-align:center; padding: 20px;">Din kundvagn är tom.</p>';
          return;
        }

        let total = 0;
        container.innerHTML = items.map(item => {
          total += item.price * item.quantity;
          return `
            <div class="cart-item">
              <img src="/images/${item.image}" alt="${item.name}" />
              <div class="cart-item-info">
                <p>${item.name}</p>
                <p>${item.price} kr</p>
              </div>
              <div class="cart-item-right">
                <div class="quantity-controls">
                  <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                </div>
                <p>${item.price * item.quantity} kr</p>
                <button class="remove-btn" onclick="removeFromCart(${item.id})">🗑</button>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML += `<div class="cart-total"><strong>Totalt: ${total} kr</strong></div>`;
      }

      async function updateQuantity(id, newQuantity) {
        await fetch('/api/cart/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, quantity: newQuantity })
        });
        renderCart();
      }

      async function removeFromCart(id) {
        await fetch('/api/cart/remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        renderCart();
      }

      renderCart();
    </script>
  </body>
</html>
